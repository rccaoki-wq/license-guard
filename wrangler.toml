name = "license-guard"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 独自ドメイン。
#
# workers.dev は Cloudflare 自身が持つゾーンなので、割り当てられたサブドメインに
# DNS レコードを足せない。ホスト名そのものへの TXT を要求する検証
# （Smithery の verified 等）は、そのままでは永久に通せなかった。
#
# **workers_dev = true を消してはいけない。** routes を足した時点で
# wrangler は workers.dev を既定で無効化する。公式 MCP レジストリ・Glama・
# Smithery・mcp.so・docker/mcp-registry・awesome-mcp-servers の掲載は
# すべて workers.dev の URL を指しているので、消すと全部同時に壊れる。
# 実際に一度無効化してしまい、デプロイ直後の警告で気づいた。
workers_dev = true

[[routes]]
pattern = "licenseguard.tenchorooms.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "license-guard"
database_id = "52de0a98-8bf0-4add-9a00-d97bdd08475b"
migrations_dir = "migrations"

# 無認証の公開エンドポイントのためのレート制限。
# 依存数上限(200)・本文上限(100KB)・上流タイムアウト(5秒)で被害範囲は
# 既に限定されているが、連続的な濫用は防げないため上限を設ける。
#
# 上流への外部リクエストを伴う経路は厳しく、静的な判定だけで返せる経路は
# 緩くする。Cloudflare のロケーション単位でのカウントであり、厳密な会計
# ではなく「permissive, eventually consistent」である点に留意。

[[ratelimits]]
name = "SCAN_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60
